plan_id: "20260522-cloche-mapping-registration-too-early"
objective: "Clarify updated bug report: Cloche still throws because a Provider passed to attributeProvider is absent when TargetCompilation.registerNamespace configures transforms from setupModTransformationPipeline."
focus_area: "mapping_registration_too_early"
created_at: "2026-05-22"
created_by: "GitHub Copilot"
status: completed
tldr: |
  - The error path is centered on TargetCompilation.init -> setupModTransformationPipeline -> sourceNamespaces.all/registerNamespace.
  - registerNamespace calls compilation.baseAttributes(from/to), which reaches TargetCompilation.attributes, then MinecraftTargetInternal.attributes.
  - MinecraftTargetInternal.attributes registers TargetAttributes.MINECRAFT_VERSION and CLOCHE_MINECRAFT_VERSION through attributeProvider(target.minecraftVersion).
  - Gradle requires attributeProvider providers to be present when queried; target.minecraftVersion is only conventioned from cloche.minecraftVersion in addTarget before handleTarget, so absent global/user target version still fails during transform registration.
  - Updated focus should stay on lifecycle/order and attribute-provider presence, not tests.
