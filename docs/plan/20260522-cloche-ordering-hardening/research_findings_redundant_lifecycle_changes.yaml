        location: "ClocheExtension.kt:97-108"
        snippet: "objects.newInstance<FabricTargetImpl>(it).also(::prepareTarget)"
      - file: "TargetApplicator.kt"
        location: "TargetApplicator.kt:22-25"
        snippet: "cloche.whenTargetConfigured { target -> finalizeTarget(cloche, project, target) }"
    prevalence: common
  - category: structure
    pattern: "Identity/idempotence guards around lifecycle callbacks"
    description: "preparedTargets/configuredTargets and per-target flags prevent repeated lifecycle work across multiple paths."
    examples:
      - file: "ClocheExtension.kt"
        location: "ClocheExtension.kt:123-124"
        snippet: "Collections.newSetFromMap(IdentityHashMap<MinecraftTarget, Boolean>())"
      - file: "TargetCompilation.kt"
