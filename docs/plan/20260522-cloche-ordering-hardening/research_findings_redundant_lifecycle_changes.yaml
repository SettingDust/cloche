plan_id: "20260522-cloche-ordering-hardening"
objective: "Review current Cloche lifecycle diff and identify changes no longer needed after refactor."
focus_area: "redundant_lifecycle_changes"
created_at: "2026-05-22"
created_by: "GitHub Copilot"
status: completed
tldr: |
  - Current diff implements a two-phase lifecycle: early prepare via target factories/prepareTarget/addTarget/handleTarget, late finalization via targetConfigured/whenTargetConfigured/finalizeTarget.
  - The main cleanup candidate is duplicate explicit prepareTarget calls after targets.maybeCreate, because factories already call prepareTarget.
  - The idempotence guard in prepareTarget makes the duplicate call safe, but no longer necessary on the named-container target path.
  - Single-target prepareTarget remains necessary because it bypasses the targets container factory.
  - The late afterConventionsApplied hooks and setupModTransformationPipelineOnce guards remain needed; previous verification showed publishToMavenLocal and ModSets help succeeding without the prior failure patterns.
