        snippet: "sourceNamespaces.add(DependencyNamespaceAttribute.SEARGE); registerMappings()"
    prevalence: occasional
  - category: structure
    pattern: "Redundant safe prepare call on named target path"
    description: "targets.maybeCreate invokes the registered factory, whose factory already calls prepareTarget; the subsequent explicit prepareTarget(target) is therefore safe but redundant for normal named target creation."
    examples:
      - file: "ClocheExtension.kt"
        location: "ClocheExtension.kt:97-108"
        snippet: "registerFactory(...).also(::prepareTarget)"
      - file: "ClocheExtension.kt"
        location: "ClocheExtension.kt:239-241"
        snippet: "val target = targets.maybeCreate(name, type); prepareTarget(target)"
    prevalence: rare
