        snippet: "if (modTransformationPipelineConfigured) return"
    prevalence: common
  - category: architecture
    pattern: "Late loader mapping defaults"
    description: "Fabric/Forge mapping defaults and source namespaces moved out of init into afterConventionsApplied."
    examples:
      - file: "FabricTargetImpl.kt"
        location: "FabricTargetImpl.kt:457-466"
