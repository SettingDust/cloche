plan_id: "20260522-cloche-ordering-hardening"
objective: "Implement robust Cloche lifecycle split: early target prepare registers source sets, tasks, and configurations before external configureEach callbacks; late finalization registers mappings, namespaces, and transforms after user target DSL/provider values and nonMod configurations. Preserve ongoing fixes and verify with ModSets."
created_at: "2026-05-22"
created_by: "GitHub Copilot"
status: pending
research_confidence: high
plan_metrics:
  wave_1_task_count: 1
  total_dependencies: 3
  risk_score: medium
tldr: |
  Split target lifecycle into idempotent early preparation and late finalization. Keep early preparation at target factory/maybeCreate time for source sets/tasks/configurations, move mapping namespace/transform registration to the already-deferred targetConfigured/applyTargets path, then publish locally and verify ModSets with the required JAVA_HOME.
open_questions: []
gaps: []
pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: "Late finalization is never called for a target created through single-target mode or named container DSL."
      likelihood: low
      impact: high
      mitigation: "Use existing targetConfigured callbacks for both SingleTargetConfigurator.target and ClocheExtension.target, and keep preparation/finalization idempotent."
    - scenario: "Mappings or namespace listeners remain in early preparation and still query absent provider-backed attributes before user DSL values are set."
      likelihood: medium
      impact: high
      mitigation: "Audit addTarget, handleTarget, afterConventionsApplied, finalizeTargetModTransformationPipeline, TargetCompilation.setupModTransformationPipelineOnce, FabricTargetImpl, and ForgeLikeTargetImpl before implementation."
    - scenario: "External configureEach callbacks observe targets before generated task names/configurations exist."
      likelihood: medium
      impact: high
      mitigation: "Keep handleTarget in early prepare invoked from target factories and maybeCreate path before user configure actions and before external callbacks rely on task existence."
  assumptions:
    - "The current uncommitted lifecycle work in ClocheExtension.kt, ClochePlugin.kt, TargetApplicator.kt, TargetHandler.kt, and TargetCompilation.kt is intentional and must be preserved unless directly refined."
    - "ModSets resolves the locally published existing Cloche version from Maven local."
    - "No markdown documentation should be created for this change."
implementation_specification:
  code_structure: "Keep lifecycle orchestration in ClocheExtension.kt, ClochePlugin.kt, and target handlers. Early prepare should be target-object idempotent and responsible for conventions plus handleTarget. Late finalization should run after user target DSL through whenTargetConfigured/applyTargets and should register loader mapping defaults, mapping actions, source namespaces, and remap transforms."
  affected_areas:
    - "Target creation and configureEach ordering"
    - "Loader mapping namespace registration"
    - "Mod transformation pipeline registration"
    - "External ModSets Gradle verification"
  component_details:
    - component: "Early target preparation"
      responsibility: "Install target conventions and register source sets, tasks, dependency configurations, variants, and generated task wiring before external target callbacks need them."
      interfaces:
        - "ClocheExtension.prepareTarget(target)"
        - "addTarget(cloche, project, target)"
        - "handleTarget(target)"
      dependencies: []
      integration_points:
        - "PolymorphicDomainObjectContainer target factories"
        - "ClocheExtension.target maybeCreate path"
        - "SingleTargetConfigurator.target"
    - component: "Late target finalization"
      responsibility: "After user target DSL/provider values are applied, install loader mapping defaults, cloche mapping actions, source namespace listeners, and remap transforms exactly once."
      interfaces:
        - "ClocheExtension.targetConfigured(target)"
        - "applyTargets(project, cloche)"
        - "finalizeTarget(cloche, project, target)"
        - "finalizeTargetModTransformationPipeline(target)"
      dependencies:
        - component: "Early target preparation"
          relationship: "Requires source sets/configurations/tasks and nonMod configurations to already exist."
      integration_points:
        - "FabricTargetImpl.afterConventionsApplied"
        - "ForgeLikeTargetImpl.afterConventionsApplied"
        - "TargetCompilation.setupModTransformationPipelineOnce"
    - component: "External verification"
      responsibility: "Publish current Cloche artifact locally and verify ModSets no longer fails with missing versionFabric201Jar/task ordering or absent provider mapping errors."
      interfaces:
        - "gradlew.bat publishToMavenLocal"
        - "ModSets gradlew.bat help or debugClochePatchResolution"
      dependencies:
        - component: "Late target finalization"
          relationship: "Consumes implementation behavior via Maven local publication."
      integration_points:
        - "Maven local"
        - "D:\Projects\\Minecraft\\ModSets"
