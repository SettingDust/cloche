plan_id: "20260522-cloche-ordering-hardening"
objective: "Inspect current Cloche lifecycle implementation/diff and produce exact implementation guidance for early prepare and late finalization ordering."
focus_area: "current Cloche target lifecycle and ordering hardening"
created_at: "2026-05-22"
created_by: "GitHub Copilot"
status: completed
tldr: |
  - Current uncommitted diff already splits lifecycle into early prepare and late finalization.
  - Early prepare is now invoked from target factories and explicit single/multi target creation paths, before user target DSL actions complete.
  - Late finalization is now wired through ClocheExtension.whenTargetConfigured and TargetApplicator.applyTargets after user target DSL actions call targetConfigured.
  - The reported failure path is Gradle PolymorphicDomainObjectContainer.maybeCreate firing targets.configureEach callbacks during object creation; therefore early prepare must happen in the registered container factory itself, not only after maybeCreate returns.
  - Mapping actions, loader default mappings/source namespaces, and mod transformation registration are late-only because they depend on user DSL/provider values and configurations created by handleTarget.
