current_order_trace:
  multi_target_explicit:
    - "cloche.fabric/forge/neoforge calls ClocheExtension.target(name,type,configure)."
    - "common() creates/retrieves common target."
    - "targets.maybeCreate(name,type) starts Gradle container realization."
    - "registered PolymorphicDomainObjectContainer factory constructs FabricTargetImpl/ForgeTargetImpl/NeoForgeTargetImpl and immediately calls prepareTarget(instance)."
    - "prepareTarget identity guard calls addTarget once."
    - "addTarget sets target minecraftVersion convention and metadata conventions, then handleTarget creates source sets/tasks/configurations/variants/artifacts; targetHandled runs one-per-target-type callbacks."
    - "Any targets.configureEach callbacks fired by Gradle during maybeCreate now observe prepared target model."
    - "maybeCreate returns target; explicit prepareTarget(target) runs but is no-op due preparedTargets identity guard."
    - "User configure action executes and sets loaderVersion/mappings/secondary compilations/dependencies."
    - "target.dependsOn(common) is added."
    - "targetConfigured(target) runs late callbacks."
    - "applyTargets whenTargetConfigured callback invokes finalizeTarget, which calls afterConventionsApplied, root mappingActions, finalizeTargetModTransformationPipeline, then continues target/common linkage."
  single_target:
    - "singleTarget { fabric/forge/neoforge } calls SingleTargetConfigurator.target(type,configure)."
    - "Existing target case reuses target and only executes configure; no targetConfigured rerun because it was configured on first creation."
    - "New target case constructs instance with empty name, assigns target field, calls prepareTarget before user configure, executes configure, then calls targetConfigured."
    - "No Gradle PolymorphicDomainObjectContainer factory is involved for single-target creation, so prepareTarget in SingleTargetConfigurator is the critical early hook."
  late_namespace_transform_flow:
    - "finalizeTarget calls target.afterConventionsApplied."
    - "Fabric afterConventionsApplied adds fabricIntermediary mapping default and INTERMEDIARY source namespace; Forge-like adds userdev mappings dependency and SEARGE source namespace."
    - "finalizeTarget applies root cloche.mappingActions to target."
    - "finalizeTargetModTransformationPipeline calls setupModTransformationPipelineOnce for main and already configured secondary compilations."
    - "setupModTransformationPipeline registers RemapAction transforms from target.sourceNamespaces and target.mappings.sourceNamespaces via DomainObjectCollection.all listeners."
implementation_steps:
  - step: 1
    area: "Preserve factory-time early prepare"
    exact_guidance: "Keep .also(::prepareTarget) inside each targets.registerFactory block in ClocheExtension.kt. This is required because targets.configureEach can run inside maybeCreate before ClocheExtension.target resumes; a prepareTarget call only after maybeCreate is too late for the reported versionFabric201Jar missing failure."
  - step: 2
    area: "Keep explicit prepare fallback idempotent"
    exact_guidance: "Keep prepareTarget(target) after targets.maybeCreate and in SingleTargetConfigurator.target, but rely on preparedTargets identity guard to avoid duplicate addTarget. The post-maybeCreate call covers pre-existing target retrieval or non-factory paths; the factory call covers newly-created target ordering."
  - step: 3
    area: "Keep handleTarget early"
    exact_guidance: "Do not move handleTarget out of addTarget. handleTarget is what creates source sets, jar/include/remap tasks, local configurations, outgoing variants, assets/natives wiring, and archives artifact before external configureEach callbacks inspect the target."
  - step: 4
    area: "Keep mapping registration late"
    exact_guidance: "Do not call cloche.mappingActions.all(target::mappings), target.afterConventionsApplied, registerMappings, or setupModTransformationPipeline from addTarget/handleTarget. They belong in finalizeTarget after user target configure actions have populated loaderVersion/mappings and after early configurations exist."
  - step: 5
    area: "Preserve after-user-DSL finalization"
    exact_guidance: "Keep applyTargets on cloche.whenTargetConfigured rather than cloche.targets.all for Minecraft targets. targetConfigured must be called after configure.execute(target) in both ClocheExtension.target and SingleTargetConfigurator.target."
  - step: 6
    area: "Idempotency"
    exact_guidance: "Maintain all guards: preparedTargets identity set, configuredTargets set, Fabric/ForgeLike mappingsRegistered, TargetCompilation.modTransformationPipelineConfigured. Without these, factory prepare + explicit prepare or callback replay can duplicate Gradle model registrations."
  - step: 7
    area: "Callback type behavior"
    exact_guidance: "targetHandled currently uses configuredTargetCallbackTypes keyed by callback type, not target instance. This preserves previous one-per-type behavior for singleTargetCallbacks such as Fabric component metadata rule setup. Do not convert to per-target callbacks unless deliberately changing semantics."
  - step: 8
    area: "Ordering of dependsOn(common)"
    exact_guidance: "The current multi-target path finalizes after target.dependsOn(common). This means useCommonMetadata and TargetApplicator linkage see the common dependency. For factory-time prepare, handleTarget runs before this dependsOn call; avoid moving source-dependency linkage into early handleTarget."
  - step: 9
    area: "Secondary compilations"
    exact_guidance: "finalizeTargetModTransformationPipeline only sees secondary compilations configured before targetConfigured; future secondary compilations registered after finalization still get namespace listeners only if their setupModTransformationPipelineOnce is invoked elsewhere. Current DSL normally configures secondary compilations inside the target configure action, so this is acceptable for current scope but is a pitfall for late mutation."
  - step: 10
    area: "Verification hook"
    exact_guidance: "A regression should exercise an external targets.configureEach callback that expects a target jar/include task or source-set configuration immediately during maybeCreate, plus mapping DSL values set inside target configure. Existing tests do not directly cover this."
pitfalls:
  - pitfall: "Calling prepareTarget only after maybeCreate returns"
    impact: "Does not fix configureEach firing inside maybeCreate; external callbacks can still observe missing target tasks/configurations."
    affected:
      - "ClocheExtension.target(name,type,configure)"
      - "ClocheExtension.targets factory registrations"
  - pitfall: "Moving handleTarget to targetConfigured/finalizeTarget"
    impact: "Reintroduces missing versionFabric201Jar-style tasks/configurations for callbacks that run during target creation."
    affected:
      - "ClochePlugin.addTarget"
      - "TargetHandler.handleTarget"
  - pitfall: "Leaving mappingActions/registerMappings/transform registration in addTarget"
    impact: "Can query provider-backed user DSL values too early and register transforms without final user/source namespace state."
    affected:
      - "ClochePlugin.addTarget"
      - "MinecraftTargetInternal.registerMappings"
      - "TargetCompilation.setupModTransformationPipeline"
  - pitfall: "Removing idempotency guards"
    impact: "Duplicate task/configuration/transform registration from factory prepare plus explicit prepare or callback replay."
    affected:
      - "ClocheExtension.preparedTargets"
      - "FabricTargetImpl.mappingsRegistered"
      - "ForgeLikeTargetImpl.mappingsRegistered"
      - "TargetCompilation.modTransformationPipelineConfigured"
  - pitfall: "Assuming cloche.targets.configureEach in init is external-only"
    impact: "Internal configureEach in ClocheExtension.init adds dependsOn(common()) and can itself realize/common-configure during container callbacks; keep ordering minimal and avoid invoking late finalization from there."
    affected:
