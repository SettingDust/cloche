plan_id: 20260521-replace-remap-namespace-design
objective: 实现替换 cloche 原有 RemapNamespaceAttribute 方案；不兼容旧方案；mapping 自带 namespace graph；loader 默认 source namespace；MC 26 不需要反混淆；target 通常 named
focus_area: cloche RemapNamespaceAttribute API/schema、MappingsBuilder、TargetCompilation、GenericMinecraftRemapTasks 实施点
created_at: 2026-05-21
created_by: gem-researcher
status: completed
tldr: |
  - 当前方案用 Gradle 属性 earth.terrarium.cloche.remapNamespace 标记依赖输入 namespace，并用 REMAPPED_ATTRIBUTE 表示是否已转到目标 namespace。
  - MappingsBuilder 同时负责映射依赖和可 remap namespace 列表，默认加入 INITIAL(none) 与 OBF(obf)，Fabric/Forge helper 追加 intermediary/srg。
  - TargetCompilation 的依赖 transform 管线把 INITIAL 解析为 target.modRemapNamespace，把所有输入 remap 到 named（RemapAction 默认 targetNamespace=named）。
  - Minecraft 自身 remap 仍硬编码 obf/intermediary/srg/named 路径；GenericMinecraftRemapTasks 通过注册 provider/classpath 支持按 namespace 取得或生成 Minecraft jar。
  - 最小替换策略是引入新的 namespace schema/attribute 表达 source/target namespace 与 mapping graph，保留 REMAPPED_ATTRIBUTE 语义或同步替换 variant 选择，删除 INITIAL 哨兵与旧 remapNamespace API。
