patterns_found:
  - category: architecture
    pattern: Boolean remapped state plus string source namespace attribute
    description: Dependency selection uses REMAPPED_ATTRIBUTE for transformed/untransformed state and RemapNamespaceAttribute.ATTRIBUTE for source namespace; target namespace is implicit named.
    examples:
      - file: src/main/kotlin/earth/terrarium/cloche/target/compilation/TargetCompilation.kt
        location: TargetCompilation.kt:210-219
        snippet: from REMAPPED=false + remapNamespace=INITIAL -> to REMAPPED=true + remapNamespace=remapNamespace
    prevalence: common
  - category: structure
    pattern: Mapping DSL doubles as transform registry source
    description: MappingsBuilder adds mapping dependencies and also mutates remapNamespaces, which TargetCompilation reads afterEvaluate to register transforms.
    examples:
      - file: src/main/kotlin/earth/terrarium/cloche/api/MappingsBuilder.kt
        location: MappingsBuilder.kt:64-68
        snippet: remapNamespaces default INITIAL/OBF and helpers append intermediary/srg
    prevalence: common
  - category: architecture
    pattern: Loader/internal namespace is represented by minecraftRemapNamespace
    description: Target implementations compute minecraftRemapNamespace from loader and mapping compatibility; empty string means no remap/named direct path.
    examples:
      - file: src/main/kotlin/earth/terrarium/cloche/target/fabric/FabricTargetImpl.kt
        location: FabricTargetImpl.kt:342-357
        snippet: Fabric uses intermediary unless unobfuscated + default/official-compatible
      - file: src/main/kotlin/earth/terrarium/cloche/target/forge/neo/NeoForgeTargetImpl.kt
        location: NeoForgeTargetImpl.kt:37-53
        snippet: NeoForge default official-compatible path returns empty namespace
    prevalence: common
  - category: architecture
    pattern: Mapping graph supports namespace switching internally
    description: minecraft-codev uses MemoryMappingTree and MappingSourceNsSwitch; RemapTask/RemapAction accept arbitrary source/target strings and default target to named.
    examples:
      - file: ../minecraft-codev/minecraft-codev-remapper/src/main/kotlin/net/msrandom/minecraftcodev/remapper/MappingResolutionRule.kt
        location: MappingResolutionRule.kt:21-38
        snippet: MappingTreeProvider.withTree switches source namespace before applying rules
    prevalence: common
  - category: testing
    pattern: No dedicated tests found for remap namespace behavior in cloche src/test or integration-test grep scope
    description: Existing searched tests did not match remapNamespace/RemapNamespaceAttribute/MappingsBuilder/remapJar terms; verification likely needs integration Gradle builds or new tests.
    examples:
      - file: src/test/kotlin
        location: src/test/kotlin grep
        snippet: no matches for remapNamespace|RemapNamespaceAttribute|MappingsBuilder|remapJar
    prevalence: rare
