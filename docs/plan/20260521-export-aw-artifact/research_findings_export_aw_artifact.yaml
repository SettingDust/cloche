      purpose_for_domain: RemapJar and RemapAction used to remap mod jars and embedded extra files.
domain_security_considerations:
  sensitive_areas:
    - area: Jar zip mutation
      location: FabricTargetImpl.kt/NeoForgeTargetImpl.kt
      concern: Writes into built jar file systems; must avoid path traversal if user-controllable paths are introduced for AW artifact names.
    - area: Artifact transform inputs
      location: TargetCompilation.kt
      concern: Resolves external dependency artifacts; variant attributes should not accidentally select arbitrary non-AW artifacts as AW inputs.
  authentication_patterns_in_domain: None observed in inspected scope.
  authorization_patterns_in_domain: None observed in inspected scope.
  data_validation_in_domain: Existing code filters AW merge inputs by extension; Fabric embedded remapper only follows fabric.mod.json accessWidener path if present.
testing_patterns:
  framework: Gradle TestKit/JUnit in project, not inspected for this focus area
  coverage_areas: [attribute wiring, target compilation task wiring, loader metadata generation likely]
  test_organization: src/test/kotlin for Cloche; minecraft-codev has module-specific tests under minecraft-codev-access-widener/src/test/kotlin
  mock_patterns: []
practical_design:
  producer_hooks:
    - hook: MinecraftTargetInternal.registerAccessWidenerMergeTask(compilation)
      exact_location: src/main/kotlin/earth/terrarium/cloche/target/MinecraftTargetInternal.kt:157 plus overrides in FabricTargetImpl.kt and ForgeLikeTargetImpl.kt
      design: Return or expose the generated AW/AT output provider instead of only mutating jar tasks. Minimal shape: add a nullable Provider<RegularFile> property/map on CompilationInternal or TargetCompilation for accessWidenerArtifact produced by loader hooks; Fabric sets it to MergeAccessWideners.output, ForgeLike sets it to GenerateAccessTransformer.output only if AT export is desired.
      caveat: Existing abstract method returns Unit, so changing it to Provider<RegularFile>? touches all implementations. Alternative lower-impact hook: create a new open method on MinecraftTargetInternal, e.g. registerAccessWidenerArtifact(compilation): Provider<RegularFile>?, and call it in TargetHandler immediately after registerAccessWidenerMergeTask().
    - hook: TargetHandler library consumable configuration loop
      exact_location: src/main/kotlin/earth/terrarium/cloche/target/TargetHandler.kt:253-310
      design: Add an AW outgoing variant to both sourceSet.apiElementsConfigurationName and sourceSet.runtimeElementsConfigurationName beside remapped/remappedIncludesStripped. Attach the merged AW provider as artifact. Skip it from Maven Java component if it is only for Gradle variant consumption; do not skip if Maven publication should include it as classifier artifact.
      attributes: Set Category.CATEGORY_ATTRIBUTE to a new category such as objects.named("access-widener") or use ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE with a new type string such as "cloche-access-widener". Also set REMAPPED_ATTRIBUTE according to the file namespace, RemapNamespaceAttribute.ATTRIBUTE to INITIAL or target.modRemapNamespace as applicable, ClocheTargetAttribute.ATTRIBUTE to target.name, CompilationAttributes.DISTRIBUTION/_CLOCHE_SIDE/DATA through compilation.consumableAttributes, and INCLUDE_TRANSFORMED_OUTPUT_ATTRIBUTE=false.
      caveat: If the artifact is published as a Maven artifact, Gradle Module Metadata will carry attributes, but Maven consumers will only see classifier/extension. Use a stable classifier if Maven visibility matters.
    - hook: ProjectPluginApplicator attributesSchema/artifactTypes
      exact_location: src/main/kotlin/earth/terrarium/cloche/ProjectPluginApplicator.kt:87-128
      design: Register any new attribute/category/artifact type defaults. A dedicated artifact type avoids pretending the AW file is a jar and prevents accidental JAR transform selection.
      config_names: Add constants near REMAPPED_VARIANT_NAME/CLASSES_AND_RESOURCES_VARIANT_NAME or Attributes.kt, e.g. ACCESS_WIDENER_VARIANT_NAME = "accessWidener", ACCESS_WIDENER_ARTIFACT_TYPE = "cloche-access-widener".
      caveat: Gradle artifactTypes defaults are keyed by extension/type; raw .accessWidener may need explicit attributes on the outgoing artifact/variant because artifact type inference may not use the new type automatically.
  consumer_hooks:
    - hook: TargetCompilation.getAccessWidenerClasspath(configurationName, remapped)
      exact_location: src/main/kotlin/earth/terrarium/cloche/target/compilation/TargetCompilation.kt:110-123
      design: Add a second artifactView (or replace current jar view) that requests the AW artifact variant/type/category. Combine files from dedicated AW artifactView with existing jar artifactView during migration. Example conceptual attributes: ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE="cloche-access-widener", REMAPPED_ATTRIBUTE=remapped or false depending namespace, RemapNamespaceAttribute.ATTRIBUTE=RemapNamespaceAttribute.INITIAL, ClocheTargetAttribute.ATTRIBUTE=target.name/INITIAL compatibility.
      caveat: Current function does not receive target, only configurationName/remapped. To set target-specific attribute, pass target or target.name into getAccessWidenerClasspath().
    - hook: registerCompilationTransformations AccessWiden setup
      exact_location: src/main/kotlin/earth/terrarium/cloche/target/compilation/TargetCompilation.kt:152-176
      design: Keep AccessWiden.accessWideners.from(accessWidenerClasspath), but ensure accessWidenerClasspath includes standalone AW artifacts and still includes jar artifacts for backward compatibility until all producers export AW.
      caveat: AccessWiden/loadAccessWideners can already read .accesswidener/.ct files and zip artifacts via service rules; separate AW file inputs work without changing AccessWiden.
    - hook: Linkage.kt internal dependency propagation
      exact_location: src/main/kotlin/earth/terrarium/cloche/Linkage.kt:94-200
      design: For project dependencies, either keep direct accessWideners.from(dependency.accessWideners) for source-level semantics, or switch/augment to consume dependency's produced AW artifact provider so downstream modules receive the merged/transitively composed AW exactly as external consumers would. If exporting only external Gradle metadata, keep direct copies but attach AW artifact for non-source dependency consumption.
      caveat: Direct propagation uses raw configured AWs, not loader-merged output and not necessarily the remapped/export namespace. A separate artifact can change behavior for project dependencies if used unconditionally.
  producer_consumer_changes:
    - change: Add AW artifact identity
      details: Define constants for variant name and artifact type/category, e.g. accessWidener and cloche-access-widener. Register schema/defaults in ProjectPluginApplicator.
    - change: Expose generated AW file from loader hooks
      details: Fabric can expose MergeAccessWideners.output. ForgeLike can expose GenerateAccessTransformer.output if the artifact is loader-specific AT; if the goal is Fabric AW only, only FabricTargetImpl should produce the standalone AW variant.
    - change: Attach AW artifact variant
      details: In TargetHandler's api/runtime elements loop, create outgoing.variants.create(ACCESS_WIDENER_VARIANT_NAME) with attributes and artifact(provider). Add component skip rules if not intended for Maven publication.
    - change: Consume AW artifact variant
      details: Update getAccessWidenerClasspath() to request the new artifact type/category and merge with legacy jar artifact view; pass target name if target attribute is required.
    - change: Preserve jar embedding
      details: Do not remove FabricTargetImpl Jar.from(MergeAccessWideners.output) or metadata patches unless separately changing runtime packaging; exported AW is additional transport for compile-time widening.
  exact_current_config_names:
    producer_configs: [apiElements, runtimeElements, javadocElements, sourcesElements, modId]
    target_specific_configs: [<target><compilation>include, <target><compilation>includeFiles, <target><compilation>remapClasspath]
    dependency_buckets: [externalRuntime, externalCompile, externalApi, modImplementation, modRuntimeOnly, modCompileOnly, modApi, modCompileOnlyApi, remapClasspath]
    variants: [remapped, remappedIncludesStripped, classesAndResources, includeTransformed]
    attributes: [earth.terrarium.cloche.remapped, earth.terrarium.cloche.includeTransformedOutput, earth.terrarium.cloche.includeState, earth.terrarium.cloche.remapNamespace, earth.terrarium.cloche.target, io.github.mcgradleconventions.distribution, earth.terrarium.cloche.side, earth.terrarium.cloche.data]
  caveats:
    - Separate AW artifact namespace must be explicit. Current Fabric MergeAccessWideners only changes header named->official when namedSource is true; it does not remap class/member names. Embedded AW remapping is handled by AccessWidenerRemapper during jar remap when fabric.mod.json references it.
    - A standalone AW artifact will not be remapped by RemapJar/RemapAction unless a new transform for that artifact type is added or the producer emits it in the consumer-expected namespace.
    - AccessWiden currently requests RemapNamespaceAttribute.INITIAL for dependency artifacts. If standalone AW is emitted in target.modRemapNamespace, consumer attributes and AccessWiden.namespace/namedSource expectations must be aligned.
    - Forge/NeoForge generated artifact is accesstransformer.cfg, not an access widener. It is not directly consumable by AccessWiden.loadAccessWideners unless a rule supports that format; inspected rules support accesswidener/ct/json and zip handlers.
    - Publishing the AW variant on apiElements/runtimeElements and skipping it from component metadata means it only helps intra-build Gradle resolution, not external published consumers. Do not skip if external consumption is required.
    - Keeping legacy jar artifactView during migration avoids breaking existing dependencies whose AW is embedded in fabric.mod.json jars.
open_questions:
  - question: Should the exported artifact be Fabric .accessWidener only, or a loader-normalized access modifier artifact for Forge/NeoForge too?
    context: Fabric produces .accessWidener; ForgeLike produces accesstransformer.cfg which AccessWiden does not directly consume in inspected code.
    type: decision_blocker
    affects: [artifact type, consumer parser support, Forge/NeoForge behavior]
  - question: Should AW artifacts be published to Maven metadata or only used intra-build as skipped Gradle variants?
    context: TargetHandler currently skips auxiliary variants remapped/remappedIncludesStripped from Maven component publication.
    type: decision_blocker
    affects: [withVariantsFromConfiguration skip policy, classifier/extension, external consumers]
  - question: Which namespace should the standalone AW artifact carry?
    context: Current AccessWiden consumes with RemapNamespaceAttribute.INITIAL; Fabric embedded AW may be remapped by jar remapper, but standalone AW has no observed transform.
    type: decision_blocker
    affects: [producer task output, attributes, potential new artifact transform]
