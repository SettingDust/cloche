  - area: Existing tests for AW artifact export
    description: No dedicated Cloche tests for separate AW artifact export were found in inspected files.
    impact: nice_to_know
    affects: [test plan]
  - area: Full minecraft-codev service loader rules
    description: ZipAccessModifierResolutionRuleHandler exists, but concrete zip rules were not fully mapped beyond indicating archive support.
    impact: nice_to_know
