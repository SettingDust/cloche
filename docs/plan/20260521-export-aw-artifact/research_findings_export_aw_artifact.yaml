patterns_found:
  - category: architecture
    pattern: Attribute-driven artifact selection
    description: Cloche uses Gradle attributes to distinguish remapped state, include-transformed state, include state, target, distribution, and remap namespace. Consumer configurations/artifactViews request attributes instead of naming files directly.
    examples:
      - file: TargetCompilation.kt
        location: TargetCompilation.kt:119
        snippet: attributeProvider(REMAPPED_ATTRIBUTE, remapped); attribute(RemapNamespaceAttribute.ATTRIBUTE, RemapNamespaceAttribute.INITIAL)
      - file: ProjectPluginApplicator.kt
        location: ProjectPluginApplicator.kt:121
        snippet: artifactTypes.named(JAR_TYPE) defaults REMAPPED=false, includeState=None, remapNamespace=INITIAL
    prevalence: common
  - category: architecture
    pattern: Main artifact replacement plus skipped auxiliary variants
    description: apiElements/runtimeElements default artifacts are cleared and replaced with final includeJarTask; raw remapped jar variants are attached as outgoing variants but skipped from Maven publication.
    examples:
      - file: TargetHandler.kt
        location: TargetHandler.kt:273
        snippet: artifacts.clear(); project.artifacts.add(name, compilation.includeJarTask!!)
      - file: TargetHandler.kt
        location: TargetHandler.kt:277
        snippet: outgoing.variants.create(REMAPPED_VARIANT_NAME) { ... artifact(tasks.named(sourceSet.jarTaskName)) }
    prevalence: common
  - category: structure
    pattern: Loader-specific AW merge task hooks
    description: MinecraftTargetInternal.registerAccessWidenerMergeTask() is the hook for jar-level AW/AT generation and metadata injection; implementations differ by loader.
    examples:
      - file: FabricTargetImpl.kt
        location: FabricTargetImpl.kt:512
        snippet: tasks.register<MergeAccessWideners>(lowerCamelCaseGradleName("merge", name, compilation.featureName, "accessWideners"))
      - file: ForgeLikeTargetImpl.kt
        location: ForgeLikeTargetImpl.kt:264
        snippet: tasks.register<GenerateAccessTransformer>(lowerCamelCaseGradleName("generate", name, compilation.featureName, "accessTransformer"))
    prevalence: common
  - category: structure
    pattern: Direct internal linkage bypasses Gradle artifact resolution for AW propagation
    description: Internal compilation dependency methods copy dependency.accessWideners directly, while external dependencies rely on artifact resolution and embedded AWs in jars.
    examples:
      - file: Linkage.kt
        location: Linkage.kt:109
        snippet: accessWideners.from(dependency.accessWideners)
      - file: Linkage.kt
        location: Linkage.kt:199
        snippet: accessWideners.from(dependency.accessWideners)
    prevalence: common
  - category: testing
    pattern: No dedicated AW artifact tests found in inspected scope
    description: Existing code contains task wiring for AW embedding/application but no current Cloche test path for a separate AW artifact variant in inspected files.
    examples:
      - file: TargetCompilation.kt
        location: TargetCompilation.kt:173
        snippet: // TODO Export access wideners as a separate artifact
    prevalence: rare
related_architecture:
  components_relevant_to_domain:
    - component: TargetCompilation
      responsibility: Sets up per-compilation Minecraft transform tasks, dependency configurations, artifact transforms, include jar/remap jar tasks.
      location: src/main/kotlin/earth/terrarium/cloche/target/compilation/TargetCompilation.kt
      relationship_to_domain: Primary consumer hook for separate AW artifact resolution; getAccessWidenerClasspath() currently consumes JAR artifacts.
    - component: TargetHandler
      responsibility: Creates compilation variants and mutates outgoing api/runtime elements.
      location: src/main/kotlin/earth/terrarium/cloche/target/TargetHandler.kt
      relationship_to_domain: Primary producer hook for adding an outgoing AW artifact variant/configuration alongside jar/sources variants.
    - component: MinecraftTargetInternal.registerAccessWidenerMergeTask
      responsibility: Loader-specific AW/AT merge output and jar metadata integration.
      location: src/main/kotlin/earth/terrarium/cloche/target/MinecraftTargetInternal.kt:157
      relationship_to_domain: Hook that currently creates the merged AW/AT file but does not expose it as a reusable artifact.
    - component: FabricTargetImpl
      responsibility: Produces merged Fabric AW file, embeds it, and patches fabric.mod.json.
      location: src/main/kotlin/earth/terrarium/cloche/target/fabric/FabricTargetImpl.kt
      relationship_to_domain: Best existing source of a producer-side .accessWidener output for separate publication.
    - component: ForgeLikeTargetImpl/NeoForgeTargetImpl
      responsibility: Converts Cloche AW declarations to Forge/NeoForge access transformer file and metadata.
      location: src/main/kotlin/earth/terrarium/cloche/target/forge
      relationship_to_domain: Separate artifact semantics differ: consumer-side AccessWiden expects AW/ct/json inputs, while Forge jar artifact embeds AT.
    - component: Linkage
      responsibility: Propagates internal project dependencies and their artifacts/configurations.
      location: src/main/kotlin/earth/terrarium/cloche/Linkage.kt
      relationship_to_domain: Needs producer/consumer adjustment if project dependencies should consume exported AW artifacts instead of direct accessWideners collections.
  interfaces_used_by_domain:
    - interface: Compilation.accessWideners
      location: src/main/kotlin/earth/terrarium/cloche/api/target/compilation/Compilation.kt:19
      usage_pattern: User-facing ConfigurableFileCollection of AW inputs; merged into tasks and propagated through internal linkage.
    - interface: Gradle Configuration outgoing variants
      location: src/main/kotlin/earth/terrarium/cloche/target/TargetHandler.kt:277
      usage_pattern: attach artifacts with attributes to apiElements/runtimeElements and hide auxiliary variants from Java component publication via withVariantsFromConfiguration().skip().
    - interface: Gradle artifact transforms
      location: src/main/kotlin/earth/terrarium/cloche/target/compilation/TargetCompilation.kt:245
      usage_pattern: registerTransform maps input jar attributes to requested output jar attributes for dependency remapping.
  data_flow_involving_domain: User/linked compilation accessWideners -> loader registerAccessWidenerMergeTask produces merged .accessWidener or accesstransformer.cfg -> jar task embeds output and metadata -> remapJarTask remaps compiled jar (embedded Fabric AW can be remapped by AccessWidenerRemapper when referenced from fabric.mod.json) -> includeJarTask creates final outgoing jar. Separately, AccessWiden task for Minecraft jars consumes direct compilation.accessWideners plus dependency artifacts resolved by getAccessWidenerClasspath(); for external mods this relies on AWs inside jars or service-loaded zip resolution.
  key_relationships_to_domain:
    - from: TargetHandler.handleTarget
      to: TargetCompilation.includeJarTask
      relationship: calls
    - from: TargetHandler.handleTarget
      to: apiElements/runtimeElements outgoing variants
      relationship: composes
    - from: TargetCompilation.registerCompilationTransformations
      to: AccessWiden
      relationship: calls
    - from: TargetCompilation.getAccessWidenerClasspath
      to: compileClasspath artifactView
      relationship: calls
    - from: FabricTargetImpl.registerAccessWidenerMergeTask
      to: MergeAccessWideners
      relationship: calls
    - from: ForgeLikeTargetImpl.registerAccessWidenerMergeTask
      to: GenerateAccessTransformer
      relationship: calls
    - from: Linkage.TargetCompilation.extendFromDependency
      to: dependency.accessWideners
      relationship: composes
related_technology_stack:
  languages_used_in_domain: [Kotlin]
  frameworks_used_in_domain:
    - name: Gradle Kotlin DSL / Gradle plugin API
      usage_in_domain: Configuration, Provider API, TaskProvider, artifactView, outgoing variants, Java feature variants, artifact transforms.
    - name: minecraft-codev
      usage_in_domain: Provides AccessWiden, MergeAccessWideners, RemapJar, RemapAction, IncludesJar and remapper/loader plugins.
    - name: Fabric ClassTweaker
      usage_in_domain: Reads/writes/remaps access widener/class tweaker files.
  libraries_used_in_domain:
    - name: kotlinx.serialization
      purpose_in_domain: Reads/writes fabric.mod.json and metadata JSON.
    - name: tomlkt
      purpose_in_domain: Reads/writes Forge/NeoForge TOML metadata.
    - name: Gradle Java plugin
      purpose_in_domain: SourceSet, apiElements/runtimeElements/sourcesElements/javadocElements and jar task integration.
  external_apis_used_in_domain:
    - name: Gradle Artifact Transform API
      integration_point: TargetCompilation.setupModTransformationPipeline registers RemapAction/NoopAction.
    - name: Gradle Variant-aware Dependency Management
      integration_point: TargetHandler and ProjectPluginApplicator define attributes/variants for resolution and publication.
related_conventions:
  naming_patterns_in_domain: Task names use lowerCamelCaseGradleName with target.featureName and compilation.featureName, e.g. merge<target><compilation>AccessWideners, accessWiden<target><compilation>Minecraft, remapJar/includeJar. Variant names are short lower camel strings such as remapped, remappedIncludesStripped, includeTransformed.
  structure_of_domain: TargetHandler performs generic source set/configuration/outgoing setup; TargetCompilation owns per-compilation transform tasks and resolvable configurations; loader implementations own metadata-specific AW/AT merge and injection.
  error_handling_in_domain: Jar metadata patching is defensive and returns when generated AW/AT or metadata file is missing; no explicit error is raised for absent AW files.
  testing_in_domain: Inspected Cloche code does not show separate AW artifact tests; minecraft-codev has access widener tests outside Cloche.
  documentation_in_domain: Inline TODO in TargetCompilation identifies desired separate AW artifact export.
