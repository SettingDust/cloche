plan_id: 20260521-export-aw-artifact
objective: Research current Cloche code for how jars/sources/includes are exported and where access wideners are merged/remapped, to answer how to export AW as separate artifact.
focus_area: export_aw_artifact
created_at: 2026-05-21
created_by: GitHub Copilot
status: completed
tldr: |
  - Cloche currently consumes dependency AWs from the normal compile classpath via getAccessWidenerClasspath(), which resolves JAR artifacts with REMAPPED_ATTRIBUTE and RemapNamespaceAttribute and lets AccessWiden/loadAccessWideners discover .accesswidener/.ct files inside jars.
  - Project-to-project linkage does not consume AW artifacts; it copies dependency.accessWideners directly in Linkage.kt, while external module AWs flow only because AW files are embedded in mod jars.
  - Main jar export is configured in TargetHandler.kt by replacing api/runtime artifacts with includeJarTask and adding skipped auxiliary outgoing variants named remapped and remappedIncludesStripped.
  - AW merge/embedding happens per-loader after resources: FabricTargetImpl uses MergeAccessWideners then inserts the output into the jar and fabric.mod.json; ForgeLikeTargetImpl converts AWs to META-INF/accesstransformer.cfg; NeoForgeTargetImpl further patches neoforge.mods.toml.
  - Practical design: add a separate AW artifact as an outgoing variant on apiElements/runtimeElements (or a dedicated consumable config), add an ArtifactType/attributes for it, add consumer artifactView(s) to TargetCompilation.getAccessWidenerClasspath(), and wire project linkage to publish/consume the merged AW task output instead of only embedded jar contents.
research_metadata:
  methodology: semantic_search + grep_search + targeted read_file; no commands executed
  scope: Cloche source files for target compilation, variant publishing, linkage, attributes, Fabric/Forge AW merge; minecraft-codev task classes used by Cloche for AW merge/remap behavior
  confidence: high
  coverage: 88
  decision_blockers: 0
  research_blockers: 0
