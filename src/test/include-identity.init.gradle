gradle.settingsEvaluated { settings ->
    def codevRoot = gradle.startParameter.projectProperties['includeIdentityCodevRoot']
    if (settings.rootProject.name == 'cloche' && codevRoot != null) {
        def localCodev = new File(settings.settingsDir, codevRoot).canonicalFile
        settings.includeBuild(localCodev) {
            dependencySubstitution {
                substitute(module('net.msrandom:minecraft-codev-includes')).using(project(':minecraft-codev-includes'))
                substitute(module('net.msrandom:minecraft-codev-core')).using(project(':minecraft-codev-core'))
                substitute(module('net.msrandom:side-annotations')).using(project(':minecraft-codev-core:side-annotations'))
            }
        }
    }
}
